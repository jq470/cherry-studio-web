name: chat-e2e

on:
  workflow_run:
    workflows: ['web-build']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: chat-e2e
  cancel-in-progress: true

jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        if: ${{ github.event_name == 'workflow_run' }}
        with:
          name: cherry-studio-web
          path: dist-web
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Manual dispatch guard
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo 'workflow_dispatch requires dist-web; use the workflow_run trigger.' >&2
          exit 1

      - name: Install puppeteer
        run: npm i --no-save --no-audit --no-fund puppeteer-core@24

      - name: Boot fake provider + static host
        run: |
          nohup node scripts/fake-openai.mjs > /tmp/fake.log 2>&1 &
          nohup node scripts/e2e-server.mjs --static dist-web --port 8099 > /tmp/server.log 2>&1 &
          sleep 2
          curl -sf http://127.0.0.1:8099/ > /dev/null
          curl -sf http://127.0.0.1:8099/api.deepseek.com/v1/models > /dev/null

      - name: Run chat end-to-end
        run: node scripts/chat-e2e.mjs || true

      - name: Show logs
        if: always()
        run: |
          echo '--- fake log'; tail -20 /tmp/fake.log || true
          echo '--- server log'; tail -20 /tmp/server.log || true

      - name: Commit report
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add CHAT-E2E.md
          if git diff --cached --quiet; then
            echo 'no report change'
          else
            git commit -m "test: chat e2e report (${GITHUB_RUN_ID})"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-e2e-report
          path: |
            CHAT-E2E.md
            /tmp/chat-e2e-failure.png
          if-no-files-found: warn
