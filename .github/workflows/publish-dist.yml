name: publish-dist

# Turns the artifact produced by web-build into a public, directly downloadable
# zip on the orphan `dist` branch. GitHub artifact URLs require a logged-in
# session; raw.githubusercontent.com does not, so this is the only way to hand
# out a one-click bundle without hosting credentials.

on:
  workflow_run:
    workflows: ['web-build']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: cherry-studio-web
          path: dist-web
          run-id: ${{ github.event.workflow_run.id || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true

      - name: Zip the bundle
        run: |
          set -e
          test -f dist-web/index.html || { echo '::error::artifact missing index.html'; exit 1; }
          zip -qr cherry-studio-web.zip dist-web
          ls -lh cherry-studio-web.zip
          du -sh dist-web | cut -f1

      - name: Publish to dist branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -e
          cd "$RUNNER_TEMP"
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" publish
          cd publish
          git checkout --orphan dist
          git rm -rf . >/dev/null 2>&1 || true
          cp "$GITHUB_WORKSPACE/cherry-studio-web.zip" ./cherry-studio-web.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cherry-studio-web.zip
          git commit -m "dist: web bundle ${SHA}"
          git push -f origin dist
          echo "published: https://raw.githubusercontent.com/${REPO}/dist/cherry-studio-web.zip"
